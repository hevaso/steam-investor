<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Market Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #06090c; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 900px; background: #0d1216; padding: 20px; border-radius: 12px; border: 1px solid #172026; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .chart-box { width: 100%; height: 400px; background: #070a0d; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Dead Hand Market Terminal</h1>
        <div id="status" style="color: #00ff88; font-weight: bold;">Свързване...</div>
    </div>
    <div class="chart-box">
        <canvas id="goMarketChart"></canvas>
    </div>
</div>

<script>
    let chartInstance = null;

    async function fetchMarketData() {
        try {
            // Връзка с Go сървъра на порт 8081
            let [tickRes, chartRes] = await Promise.all([
                fetch('http://127.0.0.1:8081/api/tick'),
                fetch('http://127.0.0.1:8081/api/market-data')
            ]);
            
            let tick = await tickRes.json();
            let data = await chartRes.json();
            
            document.getElementById('status').innerText = `Цена: ${tick.price.toFixed(2)} EUR | Сигнал: ${tick.signal}`;
            renderChart(data);
        } catch (e) {
            document.getElementById('status').innerText = "Грешка: Сървърът не работи!";
        }
    }

    function renderChart(dataArray) {
        const labels = dataArray.map((_, i) => i);
        const real = dataArray.map(p => p.is_predict ? null : p.price);
        const pred = dataArray.map(p => p.is_predict ? p.price : null);

        if (!chartInstance) {
            const ctx = document.getElementById('goMarketChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Реална цена', data: real, borderColor: '#00e5ff', tension: 0.1 },
                        { label: 'Алгоритъм Предикт', data: pred, borderColor: '#ff3d00', borderDash: [5, 5], tension: 0.1 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, animation: false }
            });
        } else {
            chartInstance.data.labels = labels;
            chartInstance.data.datasets[0].data = real;
            chartInstance.data.datasets[1].data = pred;
            chartInstance.update();
        }
    }

    setInterval(fetchMarketData, 1000);
</script>
</body>
</html>
